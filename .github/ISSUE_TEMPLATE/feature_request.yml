name: Feature Request
description: Suggest a new feature or enhancement
title: "[Feature]: "
labels: ["enhancement", "needs-triage"]
body:
  - type: markdown
    attributes:
      value: |
        Have an idea to make this project better? Tell us about it!

  - type: textarea
    id: summary
    attributes:
      label: Feature Summary
      description: A short, clear summary of the feature you'd like.
      placeholder: In one or two sentences, what should this feature do?
    validations:
      required: true

  - type: textarea
    id: problem
    attributes:
      label: Problem / Motivation
      description: What problem does this solve, or what opportunity does it address?
      placeholder: |
        As a [type of user], I want [some goal] so that [some reason].
        Or: I'm always frustrated when...
    validations:
      required: true

  - type: textarea
    id: proposed-solution
    attributes:
      label: Proposed Solution
      description: Describe your ideal solution. How should it work?
      placeholder: Describe what you'd like to see happen...
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives Considered
      description: Any alternative solutions or workarounds you've considered?
      placeholder: What have you tried or considered instead?
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: Priority
      description: How important is this feature to you?
      options:
        - "Critical – blocking my work"
        - "High – would significantly improve my workflow"
        - "Medium – nice to have"
        - "Low – minor improvement"
    validations:
      required: true

  - type: dropdown
    id: scope
    attributes:
      label: Scope
      description: How large does this change feel?
      options:
        - "Small – minor addition or tweak"
        - "Medium – new functionality within an existing area"
        - "Large – significant new capability or redesign"
        - "Unknown"
    validations:
      required: false

  - type: textarea
    id: acceptance-criteria
    attributes:
      label: Acceptance Criteria
      description: How will we know when this feature is complete? (Optional but very helpful.)
      placeholder: |
        - [ ] User can...
        - [ ] System should...
        - [ ] Test coverage exists for...
    validations:
      required: false

  - type: textarea
    id: additional-context
    attributes:
      label: Additional Context
      description: Mockups, links, related issues, or any other context.
    validations:
      required: false
